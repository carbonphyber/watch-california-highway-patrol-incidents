# /.github/workflows/daily.yml
# based on https://github.com/carbonphyber/watch-epa-superfund-sites/blob/main/.github/workflows/daily.yml
on:
  schedule:
    - cron:  '*/10 * * * *'
name: Pull Data and Build
permissions:
  contents: write
  issues: write
jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@master
    - name: Set up Python 3.15
      uses: actions/setup-python@v4
      with:
        python-version: 3.15
    - name: Scrape
      run: |
        curl -o data/chp-incidents-raw.xml --no-progress-meter "https://media.chp.ca.gov/sa_xml/sa.xml?ts=$(date +%s)"
    - name: Redact PII
      run: |
        python3 scripts/redact_pii.py data/chp-incidents-raw.xml redaction_failed.marker
    - name: Notify owner on redaction failure
      if: hashFiles('redaction_failed.marker') != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh issue create \
          --repo "$GITHUB_REPOSITORY" \
          --title "PII redaction failed during scrape run $GITHUB_RUN_ID" \
          --body "The redact_pii.py step failed, so this run's commit may contain unredacted PII. Raw data was kept so the scrape would not fail. Details:
        $(cat redaction_failed.marker)

        Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        rm -f redaction_failed.marker
    - name: Commit new data
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add data/
        if [[ -n "$(git status -s -- data/)" ]]; then
          TIMESTAMP_NOW=`date -u +"%Y-%m-%dT%H:%M:%SZ"`
          git commit -m "data scraped at $TIMESTAMP_NOW"
          git push
        fi
